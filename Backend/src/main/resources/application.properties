spring.application.name=apoflow-backend
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/apoflow}

# OAuth2 client auto-config is disabled until real client credentials are provided.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# JWT Configuration
jwt.secret=${JWT_SECRET:your-32-character-secret-key-here-change-this-in-production}
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:80
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# MailerSend configuration
mailersend.token=${MAILERSEND_TOKEN:}
mailersend.from=${MAILERSEND_FROM:MS_apoflow@trial-3z0vklo6omeldpyo.mlsender.net}
app.email.enabled=${EMAIL_ENABLED:false}
